<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <h1>Website Sign-Up Page</h1>
    <div id="modal">
        <h2 id="heading">Lets Get Started!</h2>
        <form>
            <div id="firstname">
                <label for="first-name">FIRST NAME</label>
                <input type="text" id="first-name" required>
            </div>

            <div id="lastname">
                <label for="last-name">LAST NAME</label>
                <input type="text" id="last-name" required>
            </div>

            <div id="mail"> 
                <label for="email">EMAIL</label>
                <input type="email" id="email" required>
            </div>

            <div id="phonenumber">
                <label for="phone-number">PHONE NUMBER</label>
                <input type="tel" id="phone-number" required>
            </div>

            <div id="pass">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" minlength="8" pattern="^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/" required>
            </div>

            <div id="confirmpass">
                <label for="confirm-pass">CONFIRM PASSWORD</label>
                <input type="password" id="confirm-pass" minlength="8" pattern="^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/" required>
            </div>

            <div id="createaccount">
                <button id="create-account">Create Account</button>
            </div>
        </form>

        <p id="already-have-account">Already have an account? <a href="https://google.com">Log in</a></p>
    </div>
</body>
</html>
